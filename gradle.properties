# 基准环境为 GitHub Actions 公共仓库 runner：4 vCPU / 16 GB RAM / 14 GB SSD。
# 16GB 下 daemon 堆给 4096m，容纳 in-process Kotlin 编译与 R8 三 flavor 峰值。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC

# Kotlin 编译策略 A/B 实测：daemon（Kotlin 独立守护进程保持增量管线热态）vs in-process。
# A/B#1 实测 in-process 增量 7m45s；本行切 daemon 对比，取优胜后固化。
kotlin.compiler.execution.strategy=daemon

# 对齐 runner 的 4 vCPU；不设更高是因为 R8 三 flavor 同时压缩资源时内存会顶到 16GB 上限。
org.gradle.workers.max=4

# Kotlin 构建报告：逐 task/逐编译器阶段耗时写入 build/reports/kotlin-build/，用于编译耗时归因。
kotlin.build.report.output=file

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
# 配置缓存：缓存命中时直接跳过整个配置阶段（脚本编译 + 插件初始化与 task 图构建）。
# problems=warn 让不兼容项只告警不中断构建。
# 注意属性名：叫 configuration-cache（不是 configure-cache），写错不会报错而是默默失效。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
# Jetifier A/B：原值 true。若关闭后 compile 仍命中缓存（说明它对依赖字节码零改动）则可安全关闭。
android.enableJetifier=false
# Jetifier 跳过 byte-buddy（mockk 传递依赖）：其 1.18.x 是 multi-release jar，
# META-INF/versions/24/ 下类按 Java 24 编译（class file 68），Jetifier 内置 ASM 不支持。
# 它是纯 JVM 测试库、不引用 support 包，无需转换。
android.jetifier.ignorelist=byte-buddy,byte-buddy-agent

android.suppressUnsupportedCompileSdk=37
