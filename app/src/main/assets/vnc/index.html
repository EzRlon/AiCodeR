<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VNC</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  /* 容器尺寸必须用 100vw/100vh，不能靠百分比：#screen 的百分比高度依赖 html/body 的
     百分比链，而 Android WebView 里这条链会解析成 0（实测 screen=393x0 而 window=392x832），
     结果容器高 0、缩放后画面不可见，只剩黑屏（帧数据本身是好的）。 */
  #screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; }
  /* 画面强制铺满浮窗：noVNC 用内联样式设置 canvas 尺寸，这里用 !important 覆盖，
     避免出现黑边。远端分辨率会跟随浮窗宽高比（见 VncOverlayViewModel），因此拉伸极小。 */
  #screen canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    /* 触摸由脚本全权处理（见下方输入层），禁止浏览器做滚动/缩放手势识别。 */
    touch-action: none;
  }
  #status {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: #94a3b8; font: 14px/1.6 sans-serif; text-align: center; pointer-events: none;
  }
  /* 隐藏但可编辑：Android WebView 只对可编辑且可聚焦的元素弹输入法，
     display:none / visibility:hidden 都拿不到焦点，所以用 1px + 近透明。 */
  #kbdinput {
    position: fixed; left: 0; bottom: 0; width: 1px; height: 1px;
    padding: 0; margin: 0; border: 0; resize: none; outline: none;
    opacity: 0.01; color: transparent; background: transparent;
  }
  /* 右下角紧凑控制条：模式切换 + 右键/中键。 */
  #vncbar {
    position: fixed; right: 8px; bottom: 8px; z-index: 30;
    display: none; gap: 6px; align-items: center;
    font: 12px/1 sans-serif; touch-action: none; user-select: none;
  }
  #vncbar.show { display: flex; }
  #vncbar button {
    min-height: 34px; padding: 0 10px; border-radius: 17px;
    border: 1px solid rgba(148, 163, 184, 0.45);
    background: rgba(15, 23, 42, 0.78); color: #e2e8f0;
    font: 12px/1 sans-serif;
  }
  #vncbar button.active { background: #2563eb; border-color: #3b82f6; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="status"></div>
<div id="vncbar">
  <button id="modeBtn">直触</button>
  <button id="rightBtn">右键</button>
  <button id="middleBtn">中键</button>
</div>
<textarea id="kbdinput" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true"></textarea>
<script type="module">
import RFB from './core/rfb.js';

const zh = (navigator.language || '').toLowerCase().startsWith('zh');
const TEXT = zh
  ? { connecting: '正在连接 VNC…', reconnecting: '服务未就绪或连接已断开，将自动重试…' }
  : { connecting: 'Connecting to VNC…', reconnecting: 'Service not ready or disconnected, retrying…' };

const statusEl = document.getElementById('status');
const barEl = document.getElementById('vncbar');
let rfb = null;
let vncConnected = false;

// Android WebView 里布局视口高度不可信：html/body 的百分比高度和 100vh 都解析成 0
// （实测 screen=393x0 而 window.innerHeight=832），容器没有高度就缩放不出画面。
// 因此不再依赖任何 CSS 视口单位，直接用 window 尺寸写死像素，并周期性对账防止被覆盖。
const PAGE_BUILD = 'v14';
function fitScreen() {
  const w = window.innerWidth + 'px';
  const h = window.innerHeight + 'px';
  for (const id of ['screen', 'status']) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.style.width !== w) el.style.width = w;
    if (el.style.height !== h) el.style.height = h;
  }
}
fitScreen();
window.addEventListener('resize', fitScreen);
setInterval(fitScreen, 1000);

// ── 输入层：触摸 → 标准 MouseEvent ────────────────────────────────────
// 设计参照 Winlator 的 TouchpadView（Android 上跑 PC 桌面的成熟实现），要点：
//   1) 只保留「直触」与「触控板」两种模式，各自语义纯粹，不把两套手势混在一层里；
//   2) 指针不碰 noVNC 私有成员（_sendMouse / _fbWidth / _fbHeight）。触摸统一翻译成
//      画布上的标准 MouseEvent，坐标换算交给 noVNC 自己的 display.absX/absY（含缩放与
//      边缘钳制），noVNC 升级换了内部实现也不会失效。唯一保留的私有引用是键盘目标
//      `_keyboard._target`（WebView 输入法绕行，noVNC 无公开替代），缺失时自动跳过；
//   3) 不自绘光标：远端指针位置由我们发送的绝对坐标决定，客户机自绘的光标天然随画布
//      缩放，不会再现「圆环又大又糊」；
//   4) 加速按「阈值 + 固定倍率」（Winlator 的 CURSOR_ACCELERATION_THRESHOLD / 1.25×），
//      不做自创曲线：慢移保持 1:1 精确，快滑才放大。
const TAP_MAX_MS = 200;      // 点击判定最长时长（Winlator MAX_TAP_MILLISECONDS）
const TAP_MAX_TRAVEL = 10;   // 点击判定最大位移 px（Winlator MAX_TAP_TRAVEL_DISTANCE）
const LONG_PRESS_MS = 250;   // 长按判定（Winlator 长按 250ms）
const ACCEL_THRESHOLD = 10;  // 单次位移超过它才加速
const ACCEL_GAIN = 1.25;     // 加速倍率（Winlator CURSOR_ACCELERATION）

/** direct = 触摸点即指针点；trackpad = 相对移动（手机小窗精确定位）。 */
let pointerMode = 'direct';
/** 轻点/点击使用的键：0=左键，2=右键（由原生侧「鼠标按键」开关设置）。 */
let tapButton = 0;
/** 触控板模式下的虚拟指针（canvas 客户端坐标）；null 表示尚未初始化。 */
let cursor = null;

const g = {
  id: -1,          // 正在跟踪的触点 identifier
  x0: 0, y0: 0,    // 起始点
  x: 0, y: 0,      // 上一次位置
  t0: 0,           // 起始时间
  moved: false,    // 是否已超过点击允许位移
  dragDown: false, // 是否已发出 mouse down（拖动中）
  dragFrom: null,  // 拖动起点（发出 mouse down 的位置）
  longTimer: null,
  longFired: false,
  // 双指手势
  two: null,       // { x0, y0, x, y, t0, moved }
  lastPoint: null, // 直触模式最近一次触点，供右键/中键按钮定位
  owning: false,   // 本次触摸序列是否由我们接管（抬起全部手指前一直吞事件）
};

function canvasEl() { return document.querySelector('#screen canvas'); }

function canvasRect() {
  const cv = canvasEl();
  return cv ? cv.getBoundingClientRect() : null;
}

/** 把合成鼠标事件派发到画布：noVNC 的 mousedown/mousemove/mouseup 监听都在这里。 */
function synthMouse(type, x, y, button = 0, buttons = 0) {
  const cv = canvasEl();
  if (!cv) return;
  cv.dispatchEvent(new MouseEvent(type, {
    bubbles: true, cancelable: true, view: window,
    clientX: Math.round(x), clientY: Math.round(y),
    button: button, buttons: buttons,
  }));
}

/**
 * 滚轮：把双指位移原样交给 noVNC，由它按 WHEEL_STEP(50px) 累积成一格滚轮，
 * 与桌面浏览器行为一致，不另造阈值。
 */
function synthWheel(x, y, deltaY) {
  const cv = canvasEl();
  if (!cv || !deltaY) return;
  cv.dispatchEvent(new WheelEvent('wheel', {
    bubbles: true, cancelable: true, view: window,
    clientX: Math.round(x), clientY: Math.round(y),
    deltaX: 0, deltaY: deltaY, deltaMode: 0,
  }));
}

function ensureCursor() {
  const r = canvasRect();
  if (!r || !r.width) return;
  if (!cursor || cursor.x < r.left || cursor.x > r.right || cursor.y < r.top || cursor.y > r.bottom) {
    cursor = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
}

function clampCursor() {
  const r = canvasRect();
  if (!r || !cursor) return;
  cursor.x = Math.min(Math.max(cursor.x, r.left + 1), r.right - 1);
  cursor.y = Math.min(Math.max(cursor.y, r.top + 1), r.bottom - 1);
}

/** Winlator 式加速：慢移 1:1，超过阈值再乘固定倍率。 */
function accel(d) {
  return Math.abs(d) > ACCEL_THRESHOLD ? d * ACCEL_GAIN : d;
}

function cancelLongPress() {
  if (g.longTimer) { clearTimeout(g.longTimer); g.longTimer = null; }
}

function clickAt(point, button) {
  if (!point) return;
  synthMouse('mousedown', point.x, point.y, button, 1 << button);
  synthMouse('mouseup', point.x, point.y, button, 0);
}

/** 直触模式下按钮点击的位置：最近一次触点，否则画面中心。 */
function currentPoint() {
  if (pointerMode === 'trackpad') { ensureCursor(); return cursor; }
  if (g.lastPoint) return g.lastPoint;
  const r = canvasRect();
  return r ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : null;
}

/** 单指起点。直触：立刻按下（触摸即按下，最符合触摸屏直觉）；触控板：只记录，等位移或抬起再定。 */
function onSingleStart(t, now) {
  g.id = t.identifier;
  g.x0 = t.clientX; g.y0 = t.clientY;
  g.x = t.clientX; g.y = t.clientY;
  g.t0 = now;
  g.moved = false;
  g.dragDown = false;
  g.dragFrom = null;
  g.longFired = false;
  g.lastPoint = { x: t.clientX, y: t.clientY };

  if (pointerMode === 'direct') {
    // 直触：立即按下。点击=按下+抬起；按住再滑=拖动；长按=保持按下（不改成右键）。
    g.dragDown = true;
    g.dragFrom = { x: t.clientX, y: t.clientY };
    synthMouse('mousedown', t.clientX, t.clientY, tapButton, 1 << tapButton);
    return;
  }

  // 触控板：先不动键，靠位移决定「点击」还是「拖动」；长按不动 = 右键。
  ensureCursor();
  g.longTimer = setTimeout(() => {
    g.longFired = true;
    if (!g.moved) {
      cancelLongPress();
      clickAt(cursor, 2);
    }
  }, LONG_PRESS_MS);
}

function onSingleMove(t) {
  const dx = t.clientX - g.x;
  const dy = t.clientY - g.y;
  g.x = t.clientX; g.y = t.clientY;
  g.lastPoint = { x: t.clientX, y: t.clientY };

  const travel = Math.abs(t.clientX - g.x0) + Math.abs(t.clientY - g.y0);
  if (travel > TAP_MAX_TRAVEL && !g.moved) {
    g.moved = true;
    cancelLongPress();
  }

  if (pointerMode === 'direct') {
    // 直触：位置即指针位置，1:1 不发加速。
    synthMouse('mousemove', t.clientX, t.clientY, 0, g.dragDown ? (1 << tapButton) : 0);
    return;
  }

  // 触控板：相对位移累加到虚拟指针。
  if (!cursor) ensureCursor();
  if (!cursor) return;
  cursor.x += accel(dx);
  cursor.y += accel(dy);
  clampCursor();
  if (g.moved && !g.dragDown) {
    // 越过点击阈值才按住：从「按下时指针所在处」开始拖，避免拖动起点漂移。
    g.dragDown = true;
    g.dragFrom = { x: cursor.x, y: cursor.y };
    synthMouse('mousedown', cursor.x, cursor.y, tapButton, 1 << tapButton);
  }
  synthMouse('mousemove', cursor.x, cursor.y, 0, g.dragDown ? (1 << tapButton) : 0);
}

function onSingleEnd() {
  cancelLongPress();
  if (pointerMode === 'direct') {
    if (g.dragDown) {
      const p = g.lastPoint || { x: g.x, y: g.y };
      synthMouse('mouseup', p.x, p.y, tapButton, 0);
    }
    g.dragDown = false;
    return;
  }
  // 触控板：拖动则抬起；未拖动且未长按 = 在光标处点击。
  if (g.dragDown) {
    synthMouse('mouseup', cursor.x, cursor.y, tapButton, 0);
    g.dragDown = false;
  } else if (!g.moved && !g.longFired && cursor) {
    clickAt(cursor, tapButton);
  }
}

/** 双指：滚动；双指点按（短、不动）= 右键（Winlator 同款）。 */
function twoMid(e) {
  const a = e.touches[0], b = e.touches[1];
  return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}

function onTwoStart(e) {
  cancelLongPress();
  if (g.dragDown && pointerMode === 'trackpad') {
    // 单指拖动中途放下第二指：先结束拖动，避免键一直按着。
    synthMouse('mouseup', cursor.x, cursor.y, tapButton, 0);
    g.dragDown = false;
  }
  const m = twoMid(e);
  g.two = { x0: m.x, y0: m.y, x: m.x, y: m.y, t0: Date.now(), moved: false };
  // 滚动作用于两指中点：触控板模式把虚拟指针同步过去，右键也落在可预期位置。
  if (pointerMode === 'trackpad') { cursor = { x: m.x, y: m.y }; }
}

function onTwoMove(e) {
  if (!g.two) return;
  const m = twoMid(e);
  const dy = m.y - g.two.y;
  g.two.x = m.x; g.two.y = m.y;
  if (Math.abs(m.x - g.two.x0) + Math.abs(m.y - g.two.y0) > TAP_MAX_TRAVEL) g.two.moved = true;
  // 向上滑 = 内容向上（deltaY 为负，noVNC 会发 Button4），与桌面滚轮一致。
  synthWheel(m.x, m.y, dy);
}

function onTwoEnd() {
  const two = g.two;
  g.two = null;
  if (!two) return;
  if (!two.moved && Date.now() - two.t0 <= TAP_MAX_MS) {
    clickAt({ x: two.x, y: two.y }, 2);
  }
}

/**
 * 在 #screen（canvas 的父节点）上以捕获阶段接管触摸：
 * 捕获阶段先于 canvas 上的 noVNC GestureHandler 执行，stopPropagation 后它收不到事件，
 * 不会与我们重复上报点击/滚动。
 */
let inputWired = false;

function wireInput() {
  // 断线重连会重跑 vncTryConnect，监听只能挂一次，否则同一次触摸被处理多遍。
  if (inputWired) return;
  inputWired = true;
  const screenEl = document.getElementById('screen');

  const start = (e) => {
    if (!canvasEl()) return;
    g.owning = true;
    if (e.touches.length >= 2) {
      // 单指按住时落下第二指：先把单指收尾（直触模式会抬起左键），否则键会一直按着。
      if (g.id !== -1) { onSingleEnd(); g.id = -1; }
      if (!g.two) onTwoStart(e); else onTwoMove(e);
      e.preventDefault(); e.stopPropagation();
      return;
    }
    if (g.id !== -1) { e.preventDefault(); e.stopPropagation(); return; }
    onSingleStart(e.touches[0], Date.now());
    e.preventDefault(); e.stopPropagation();
  };

  const move = (e) => {
    if (!canvasEl()) return;
    if (e.touches.length >= 2) {
      if (!g.two) onTwoStart(e); else onTwoMove(e);
      e.preventDefault(); e.stopPropagation();
      return;
    }
    // 双指抬起一指后剩下的单指不接管，但仍要吞掉，避免 noVNC 手势层补一次点击。
    if (g.owning) { e.preventDefault(); e.stopPropagation(); }
    if (g.id === -1) return;
    const t = findTouch(e.touches, g.id) || e.touches[0];
    if (!t) return;
    onSingleMove(t);
  };

  const end = (e) => {
    if (!canvasEl()) return;
    if (e.touches.length === 0) {
      if (g.two) onTwoEnd();
      else if (g.id !== -1) onSingleEnd();
      g.id = -1;
      g.owning = false;
      e.preventDefault(); e.stopPropagation();
      return;
    }
    // 双指中抬起一指：立即结束双指判定，剩余手指不再参与。
    if (g.two) {
      onTwoEnd();
      g.id = -1;
      e.preventDefault(); e.stopPropagation();
    }
  };

  screenEl.addEventListener('touchstart', start, { capture: true, passive: false });
  screenEl.addEventListener('touchmove', move, { capture: true, passive: false });
  screenEl.addEventListener('touchend', end, { capture: true, passive: false });
  screenEl.addEventListener('touchcancel', end, { capture: true, passive: false });
  // 点画面唤起键盘；与输入层同一处挂载，断线重连不会重复注册。
  wireKeyboardFocus(screenEl, document.getElementById('kbdinput'));
}

function findTouch(list, id) {
  for (let i = 0; i < list.length; i++) if (list[i].identifier === id) return list[i];
  return null;
}

// 点画面唤起键盘（不拦截事件，触摸仍由上面的输入层处理）。
function wireKeyboardFocus(screenEl, kbd) {
  screenEl.addEventListener('touchstart', () => {
    if (kbd) { try { kbd.focus(); } catch (err) {} }
    const b = (typeof bridge === 'function') ? bridge() : null;
    if (b && b.onVncWantKeyboard) { try { b.onVncWantKeyboard(); } catch (err) {} }
  }, { passive: true });
}

// 保持 textarea 为空，只当按键来源；并阻止它自己的默认行为（换行/退格/切换焦点）。
let kbdSinkBound = false;

function bindKeyboardSink(kbd) {
  if (!kbd || kbdSinkBound) return;
  kbdSinkBound = true;
  kbd.value = '';
  kbd.addEventListener('input', () => { kbd.value = ''; });
  kbd.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Tab' || e.key === 'Backspace') e.preventDefault();
  }, true);
}

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.style.display = text ? 'flex' : 'none';
}

function bridge() { return window.VncBridge || null; }

function setMode(mode) {
  pointerMode = mode === 'trackpad' ? 'trackpad' : 'direct';
  const btn = document.getElementById('modeBtn');
  if (btn) {
    btn.textContent = pointerMode === 'trackpad' ? '触控板' : '直触';
    btn.classList.toggle('active', pointerMode === 'trackpad');
  }
  // 切到触控板时把虚拟指针放到画面中心；切回直触不必保留。
  if (pointerMode === 'trackpad') ensureCursor(); else cursor = null;
}
window.vncSetPointerMode = setMode;

let barWired = false;

function wireBar() {
  barEl.style.display = '';
  barEl.classList.add('show');
  if (barWired) return;
  barWired = true;
  const btn = document.getElementById('modeBtn');
  btn.textContent = pointerMode === 'trackpad' ? '触控板' : '直触';
  btn.classList.toggle('active', pointerMode === 'trackpad');
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation();
    setMode(pointerMode === 'trackpad' ? 'direct' : 'trackpad');
  }, { passive: false });

  const bindClick = (id, button) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => {
      e.preventDefault(); e.stopPropagation();
      clickAt(currentPoint(), button);
    }, { passive: false });
  };
  bindClick('rightBtn', 2);
  bindClick('middleBtn', 1);
}

window.vncTryConnect = function () {
  if (rfb) return;
  setStatus(TEXT.connecting);
  try {
    rfb = new RFB(document.getElementById('screen'), 'ws://127.0.0.1:6080', { shared: true });
    // noVNC 把 keydown/keyup 挂在 canvas 上，而 Android WebView 里 canvas 不可编辑、
    // 点它不会唤起输入法。把键盘目标换成隐藏的可编辑 textarea。
    const kbdSink = document.getElementById('kbdinput');
    if (rfb._keyboard && kbdSink) rfb._keyboard._target = kbdSink;
    bindKeyboardSink(kbdSink);
    wireInput();
    wireBar();
    // 铺满浮窗：远端分辨率已按浮窗宽高比同步（xrandr），这里缩放铺满即可。
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.clipViewport = false;
    rfb.dragViewport = false;
    rfb.background = '#000000';
    const stallTimer = setTimeout(() => {
      if (!vncConnected && rfb) {
        try { rfb.disconnect(); } catch (err) { rfb = null; setTimeout(() => window.vncTryConnect(), 2000); }
      }
    }, 6000);
    rfb.addEventListener('connect', () => {
      clearTimeout(stallTimer);
      vncConnected = true;
      setStatus('');
      if (pointerMode === 'trackpad') ensureCursor();
      const b = bridge();
      if (b) b.onVncStatus('connected');
      setTimeout(() => {
        const c = canvasEl();
        const s = document.getElementById('screen');
        const r = s ? s.getBoundingClientRect() : null;
        const bb = bridge();
        if (bb && bb.onVncDiag) {
          bb.onVncDiag('[' + PAGE_BUILD + '] canvas=' + (c ? c.width + 'x' + c.height : 'none')
            + ' screen=' + (r ? Math.round(r.width) + 'x' + Math.round(r.height) : 'none')
            + ' window=' + window.innerWidth + 'x' + window.innerHeight
            + ' mode=' + pointerMode);
        }
      }, 1500);
    });
    rfb.addEventListener('disconnect', () => {
      clearTimeout(stallTimer);
      vncConnected = false;
      rfb = null;
      const b = bridge();
      if (b) b.onVncStatus('disconnected');
      setStatus(TEXT.reconnecting);
      setTimeout(() => window.vncTryConnect(), 2000);
    });
    rfb.addEventListener('clipboard', (e) => {
      const b = bridge();
      if (b && e.detail && e.detail.text) b.pushToAndroid(e.detail.text);
    });
  } catch (err) {
    setStatus((zh ? '初始化失败：' : 'Init failed: ') + err);
    rfb = null;
  }
};

window.vncPasteFromAndroid = function () {
  if (!rfb) return;
  try {
    const b = bridge();
    rfb.clipboardPasteFrom((b && b.getAndroidClipboard()) || '');
  } catch (err) {}
};

window.vncSendText = function (text) {
  if (!rfb || !text) return;
  for (const ch of text) {
    const code = ch.codePointAt(0);
    try { rfb.sendKey(code, null, true); rfb.sendKey(code, null, false); } catch (err) {}
  }
};

window.vncSendKeysym = function (code, down) {
  if (!rfb || !code) return;
  try { rfb.sendKey(code, null, !!down); } catch (err) {}
};

// 原生侧「鼠标按键」开关：0=左键（默认），2=右键。
window.vncSetMouseButton = function (b) {
  tapButton = (b === 2) ? 2 : 0;
};

setMode('direct');
setStatus(TEXT.connecting);
window.vncTryConnect();
</script>
</body>
</html>
