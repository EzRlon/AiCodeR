<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiCodeR 远程管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --sub: #6b7280;
    --border: #e5e7eb; --hover: #f3f4f6; --accent: #2563eb; --accent-weak: #eff6ff;
    --danger: #dc2626; --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #161b22; --text: #e6edf3; --sub: #8b949e;
      --border: #30363d; --hover: #1f242c; --accent: #60a5fa; --accent-weak: #17223a;
      --danger: #f87171; --shadow: 0 1px 3px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 5;
  }
  .brand { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .brand small { color: var(--sub); font-weight: 400; font-size: 12px; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  .breadcrumb {
    padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
    color: var(--sub); font-size: 13px;
  }
  .breadcrumb a { color: var(--accent); cursor: pointer; padding: 2px 6px; border-radius: 6px; text-decoration: none; }
  .breadcrumb a:hover { background: var(--accent-weak); }
  .breadcrumb .sep { padding: 0 2px; }
  main { flex: 1; padding: 0 16px 24px; max-width: 1080px; width: 100%; margin: 0 auto; }
  .list { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 9px 14px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--hover); }
  .row .ico { width: 26px; text-align: center; font-size: 18px; flex: none; }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .row .name:hover { color: var(--accent); }
  .row .name.dir { font-weight: 600; }
  .row .meta { color: var(--sub); font-size: 12px; flex: none; width: 150px; text-align: right; }
  .row .ops { display: flex; gap: 6px; flex: none; opacity: .25; transition: opacity .15s; }
  .row:hover .ops { opacity: 1; }
  .row .ops button { padding: 3px 9px; font-size: 12px; border-radius: 7px; }
  .empty { text-align: center; color: var(--sub); padding: 60px 0; }
  footer {
    padding: 10px 16px; color: var(--sub); font-size: 12px; display: flex; gap: 16px; align-items: center;
    position: sticky; bottom: 0; background: var(--bg);
  }
  #upload-bar { flex: 1; max-width: 360px; display: none; align-items: center; gap: 8px; }
  #upload-bar .track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  #upload-bar .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .toast {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px;
    max-width: 80vw; z-index: 30; box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .toast.err { background: var(--danger); }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    background: var(--card); border-radius: 14px; padding: 18px; width: 100%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .modal .modal-title { font-weight: 600; margin-bottom: 12px; }
  .modal input {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; outline: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .drop-mask {
    position: fixed; inset: 0; background: rgba(37,99,235,.18); border: 3px dashed var(--accent);
    z-index: 25; display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 18px; font-weight: 600; pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <div class="brand">📁 AiCodeR 远程管理 <small id="host-info"></small></div>
  <div class="toolbar">
    <button id="btn-up" title="返回上一级">⬆ 上一级</button>
    <button id="btn-refresh" title="刷新列表">⟳ 刷新</button>
    <button id="btn-mkdir">＋ 新建文件夹</button>
    <button id="btn-upload" class="primary">⬆ 上传文件</button>
    <input type="file" id="file-input" multiple hidden>
  </div>
</header>
<div class="breadcrumb" id="breadcrumb"></div>
<main>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>空目录</div>
</main>
<footer>
  <span id="status">加载中…</span>
  <span id="upload-bar"><span id="upload-label">上传中</span><span class="track"><span class="fill" id="upload-fill"></span></span></span>
</footer>
<div class="toast" id="toast" hidden></div>
<div class="modal-mask" id="modal" hidden>
  <div class="modal">
    <div class="modal-title" id="modal-title">提示</div>
    <input id="modal-input" type="text" autocomplete="off" spellcheck="false">
    <div class="modal-actions">
      <button id="modal-cancel">取消</button>
      <button id="modal-ok" class="primary">确定</button>
    </div>
  </div>
</div>
<div class="drop-mask" id="drop" hidden>松开鼠标上传到当前目录</div>
<script>
(function () {
  'use strict';

  var currentPath = '/';
  var uploading = false;

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), emptyEl = $('empty'), statusEl = $('status');
  var crumbEl = $('breadcrumb'), toastEl = $('toast');
  var modalEl = $('modal'), modalTitle = $('modal-title'), modalInput = $('modal-input');
  var modalOk = $('modal-ok'), modalCancel = $('modal-cancel');
  var dropEl = $('drop'), fileInput = $('file-input');
  var uploadBar = $('upload-bar'), uploadFill = $('upload-fill'), uploadLabel = $('upload-label');

  // ── 工具 ──
  function enc(p) { return encodeURIComponent(p); }
  function fmtSize(n) {
    if (n < 0) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function fmtTime(ms) {
    if (!ms) return '';
    var d = new Date(ms), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function iconFor(e) {
    if (e.dir) return '📁';
    var n = e.name.toLowerCase(), ext = n.substring(n.lastIndexOf('.') + 1);
    if (['jpg','jpeg','png','gif','webp','bmp','svg','ico'].indexOf(ext) >= 0) return '🖼️';
    if (['mp4','mkv','mov','avi','webm'].indexOf(ext) >= 0) return '🎬';
    if (['mp3','wav','flac','ogg','m4a','aac'].indexOf(ext) >= 0) return '🎵';
    if (['zip','7z','tar','gz','xz','rar'].indexOf(ext) >= 0) return '📦';
    if (ext === 'apk') return '📱';
    if (ext === 'pdf') return '📕';
    if (['txt','md','log','json','xml','kt','java','py','js','ts','html','css','sh'].indexOf(ext) >= 0) return '📄';
    return '📄';
  }
  function joinPath(dir, name) { return (dir === '/' ? '' : dir) + '/' + name; }
  function parentOf(p) { if (p === '/' || p === '') return '/'; var i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.substring(0, i); }
  var toastTimer = null;
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = 'toast' + (isErr ? ' err' : '');
    toastEl.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }
  async function api(url, opts) {
    var r = await fetch(url, opts);
    var j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok || (j && j.ok === false)) {
      throw new Error((j && j.error) ? j.error : ('请求失败（HTTP ' + r.status + '）'));
    }
    return j;
  }

  // ── 列表 ──
  async function load(path) {
    try {
      statusEl.textContent = '加载中…';
      var data = await api('/api/list?path=' + enc(path));
      currentPath = data.path || '/';
      renderBreadcrumb(currentPath);
      renderList(data.entries || []);
    } catch (e) {
      toast(e.message, true);
      statusEl.textContent = '加载失败';
    }
  }
  function renderBreadcrumb(p) {
    crumbEl.textContent = '';
    var root = document.createElement('a');
    root.textContent = '📱 手机存储';
    root.onclick = function () { load('/'); };
    crumbEl.appendChild(root);
    if (p === '/') return;
    var parts = p.split('/').filter(function (x) { return x; });
    var acc = '';
    parts.forEach(function (part) {
      acc += '/' + part;
      var sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '/';
      crumbEl.appendChild(sep);
      var a = document.createElement('a');
      a.textContent = part;
      (function (target) { a.onclick = function () { load(target); }; })(acc);
      crumbEl.appendChild(a);
    });
  }
  function renderList(entries) {
    listEl.textContent = '';
    emptyEl.hidden = entries.length !== 0;
    statusEl.textContent = currentPath + ' · ' + entries.length + ' 项';
    entries.forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'row';
      var ico = document.createElement('span');
      ico.className = 'ico'; ico.textContent = iconFor(e);
      var name = document.createElement('span');
      name.className = 'name' + (e.dir ? ' dir' : '');
      name.textContent = e.name;
      name.title = e.name;
      if (e.dir) {
        name.onclick = function () { load(joinPath(currentPath, e.name)); };
      } else {
        name.onclick = function () { download(e.name); };
      }
      var meta2 = document.createElement('span');
      meta2.className = 'meta';
      meta2.textContent = e.dir ? '文件夹' : fmtSize(e.size);
      meta2.title = e.mtime ? fmtTime(e.mtime) : '';
      var ops = document.createElement('span');
      ops.className = 'ops';
      if (!e.dir) {
        var dl = document.createElement('button');
        dl.textContent = '下载';
        dl.onclick = function () { download(e.name); };
        ops.appendChild(dl);
      }
      var rn = document.createElement('button');
      rn.textContent = '重命名';
      rn.onclick = function () { renameEntry(e); };
      ops.appendChild(rn);
      var del = document.createElement('button');
      del.className = 'danger';
      del.textContent = '删除';
      del.onclick = function () { deleteEntry(e); };
      ops.appendChild(del);
      row.appendChild(ico); row.appendChild(name); row.appendChild(meta2); row.appendChild(ops);
      listEl.appendChild(row);
    });
  }

  // ── 文件操作 ──
  function download(name) {
    var a = document.createElement('a');
    a.href = '/api/download?path=' + enc(joinPath(currentPath, name));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  function openModal(title, showInput, initial, okText, onOk) {
    modalTitle.textContent = title;
    modalInput.style.display = showInput ? '' : 'none';
    modalInput.value = initial || '';
    modalOk.textContent = okText || '确定';
    modalEl.hidden = false;
    if (showInput) { modalInput.focus(); modalInput.select(); }
    modalOk.onclick = function () {
      var v = modalInput.value.trim();
      modalEl.hidden = true;
      onOk(v);
    };
    modalCancel.onclick = function () { modalEl.hidden = true; };
  }
  document.addEventListener('keydown', function (ev) {
    if (modalEl.hidden) return;
    if (ev.key === 'Enter') modalOk.click();
    if (ev.key === 'Escape') modalEl.hidden = true;
  });
  function renameEntry(e) {
    openModal('重命名「' + e.name + '」', true, e.name, '重命名', async function (v) {
      if (!v || v === e.name) return;
      try {
        await api('/api/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'AiCodeRemote' },
          body: JSON.stringify({ path: joinPath(currentPath, e.name), newName: v })
        });
        toast('已重命名为「' + v + '」');
        load(currentPath);
      } catch (err) { toast(err.message, true); }
    });
  }
  function deleteEntry(e) {
    openModal('删除「' + e.name + '」？', false, '', '删除', async function () {
      try {
        await api('/api/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'AiCodeRemote' },
          body: JSON.stringify({ path: joinPath(currentPath, e.name) })
        });
        toast('已删除「' + e.name + '」');
        load(currentPath);
      } catch (err) { toast(err.message, true); }
    });
  }
  function mkdir() {
    openModal('新建文件夹', true, '', '创建', async function (v) {
      if (!v) return;
      if (v.indexOf('/') >= 0) { toast('名称不能包含 /', true); return; }
      try {
        await api('/api/mkdir', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'AiCodeRemote' },
          body: JSON.stringify({ path: joinPath(currentPath, v) })
        });
        toast('已创建文件夹「' + v + '」');
        load(currentPath);
      } catch (err) { toast(err.message, true); }
    });
  }

  // ── 上传（XHR 以拿进度）──
  function uploadFiles(files) {
    if (!files || !files.length || uploading) return;
    uploading = true;
    var total = 0;
    for (var i = 0; i < files.length; i++) total += files[i].size;
    var loadedAll = 0;
    var idx = 0;
    uploadBar.style.display = 'flex';
    function next() {
      if (idx >= files.length) {
        uploading = false;
        uploadBar.style.display = 'none';
        uploadFill.style.width = '0';
        toast('上传完成（' + files.length + ' 个文件）');
        load(currentPath);
        return;
      }
      var f = files[idx++];
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?dir=' + enc(currentPath) + '&name=' + enc(f.name));
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      xhr.setRequestHeader('X-Requested-With', 'AiCodeRemote');
      uploadLabel.textContent = '上传「' + f.name + '」';
      xhr.upload.onprogress = function (ev) {
        var pct = total > 0 ? Math.round((loadedAll + ev.loaded) / total * 100) : 0;
        uploadFill.style.width = pct + '%';
      };
      xhr.onload = function () { handleOne(xhr, f); };
      xhr.onerror = function () { handleOne(xhr, f); };
      function handleOne(x, file) {
        loadedAll += file.size;
        if (x.status >= 200 && x.status < 300) {
          var ok = false;
          try { ok = JSON.parse(x.responseText).ok !== false; } catch (e) {}
          if (!ok) {
            var msg = '上传「' + file.name + '」失败';
            try { msg = JSON.parse(x.responseText).error || msg; } catch (e2) {}
            toast(msg, true);
          }
        } else {
          var m = '上传「' + file.name + '」失败（HTTP ' + x.status + '）';
          try { m = JSON.parse(x.responseText).error || m; } catch (e3) {}
          toast(m, true);
        }
        next();
      }
      xhr.send(f);
    }
    next();
  }

  // ── 事件绑定 ──
  $('btn-up').onclick = function () { load(parentOf(currentPath)); };
  $('btn-refresh').onclick = function () { load(currentPath); };
  $('btn-mkdir').onclick = mkdir;
  $('btn-upload').onclick = function () { fileInput.click(); };
  fileInput.onchange = function () { uploadFiles(fileInput.files); fileInput.value = ''; };

  var dragDepth = 0;
  document.addEventListener('dragenter', function (ev) {
    ev.preventDefault(); dragDepth++; dropEl.hidden = false;
  });
  document.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  document.addEventListener('dragleave', function (ev) {
    ev.preventDefault(); dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropEl.hidden = true;
  });
  document.addEventListener('drop', function (ev) {
    ev.preventDefault(); dragDepth = 0; dropEl.hidden = true;
    uploadFiles(ev.dataTransfer ? ev.dataTransfer.files : null);
  });

  $('host-info').textContent = location.host;
  load('/');
})();
</script>
</body>
</html>
